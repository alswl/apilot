components:
  schemas:
    ConfigField:
      additionalProperties: false
      properties:
        control:
          type: string
        depends_on:
          items:
            type: string
          type:
            - array
            - "null"
        dynamic_options:
          type: boolean
        title:
          type: string
      required:
        - title
        - control
      type: object
    ConfigOption:
      additionalProperties: false
      properties:
        label:
          type: string
        value:
          type: string
      required:
        - value
        - label
      type: object
    ConfigSchema:
      additionalProperties: false
      properties:
        fields:
          additionalProperties:
            $ref: "#/components/schemas/ConfigField"
          type: object
        schema: {}
        types:
          items:
            type: string
          type:
            - array
            - "null"
        version:
          format: int64
          type: integer
      required:
        - version
        - schema
      type: object
    DetailItem:
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
        text:
          $ref: "#/components/schemas/RichText"
        url:
          type: string
      required:
        - id
        - label
      type: object
    EditMetadataResult:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/EditMetadataResult.json
          format: uri
          readOnly: true
          type: string
        actions:
          items:
            $ref: "#/components/schemas/StateAction"
          type:
            - array
            - "null"
        create:
          type: boolean
        fields:
          items:
            $ref: "#/components/schemas/FieldDefinition"
          type:
            - array
            - "null"
      required:
        - fields
        - actions
        - create
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    FieldCatalog:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/FieldCatalog.json
          format: uri
          readOnly: true
          type: string
        defaults:
          additionalProperties:
            $ref: "#/components/schemas/MappingRule"
          type: object
        fields:
          items:
            $ref: "#/components/schemas/FieldDefinition"
          type:
            - array
            - "null"
      required:
        - fields
        - defaults
      type: object
    FieldDefinition:
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
        options:
          items:
            $ref: "#/components/schemas/Option"
          type:
            - array
            - "null"
        type:
          type: string
        writable:
          type: boolean
      required:
        - id
        - label
        - type
        - writable
      type: object
    FieldValue:
      additionalProperties: false
      properties:
        type:
          type: string
        value: {}
      required:
        - type
        - value
      type: object
    GitHubAuthorizationStatus:
