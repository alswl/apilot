components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    WorkbenchAttempt:
      additionalProperties: false
      properties:
        added:
          format: int64
          type: integer
        error:
          type: string
        finished:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        removed:
          format: int64
          type: integer
        started:
          format: date-time
          type: string
        state:
          type: string
        trigger:
          type: string
        updated:
          format: int64
          type: integer
      required:
        - id
        - trigger
        - state
        - started
        - added
        - updated
        - removed
      type: object
    WorkbenchCapabilities:
      additionalProperties: false
      properties:
        create:
          type: boolean
        import:
          type: boolean
        list_targets:
          type: boolean
        read:
          type: boolean
        refresh:
          type: boolean
        set_state:
          type: boolean
      required:
        - read
        - refresh
        - create
        - set_state
        - list_targets
        - import
      type: object
    WorkbenchConnectionInput:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/WorkbenchConnectionInput.json
          format: uri
          readOnly: true
          type: string
        bridge_certificate:
          type: string
        bridge_endpoint:
          type: string
        bridge_token:
          type: string
        id:
          type: string
        kind:
          enum:
            - obsidian_tasks
            - github_issues
          type: string
        mode:
          type: string
        name:
          maxLength: 256
          minLength: 1
          type: string
        read_method:
          type: string
        repository:
          type: string
        scope:
          type: string
        statuses:
          additionalProperties:
            type: string
          type: object
        vault:
          type: string
        version:
          format: int64
          minimum: 0
          type: integer
        write_enabled:
          type: boolean
      required:
        - kind
        - name
      type: object
    WorkbenchConnector:
      additionalProperties: false
      properties:
        capabilities:
          $ref: "#/components/schemas/WorkbenchCapabilities"
        kind:
          type: string
        name:
          type: string
        plugin_id:
          type: string
        search_aliases:
          items:
            type: string
          type:
            - array
            - "null"
        search_fields:
          items:
            type: string
          type:
            - array
            - "null"
        user_configurable:
          type: boolean
      required:
        - capabilities
        - kind
        - name
        - user_configurable
      type: object
    WorkbenchHeading:
      additionalProperties: false
      properties:
        heading_path:
          items:
            type: string
          type:
            - array
            - "null"
        level:
          format: int64
          type: integer
        reason:
          type: string
        target_version:
          type: string
      required:
        - heading_path
        - level
      type: object
    WorkbenchHealth:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/WorkbenchHealth.json
          format: uri
          readOnly: true
          type: string
        status:
          type: string
      required:
        - status
      type: object
    WorkbenchImport:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/WorkbenchImport.json
          format: uri
          readOnly: true
          type: string
        name:
          type: string
        tasks:
          items:
            $ref: "#/components/schemas/WorkbenchImportTask"
          type:
            - array
            - "null"
      required:
        - tasks
      type: object
    WorkbenchImportTask:
      additionalProperties: false
      properties:
        key:
          type: string
        state:
          type: string
        summary:
          type: string
        title:
          type: string
      required:
        - key
        - title
        - state
      type: object
    WorkbenchItemsWorkbenchConnector:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/WorkbenchItemsWorkbenchConnector.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/WorkbenchConnector"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    WorkbenchItemsWorkbenchHeading:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/WorkbenchItemsWorkbenchHeading.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/WorkbenchHeading"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    WorkbenchItemsWorkbenchNote:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/WorkbenchItemsWorkbenchNote.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/WorkbenchNote"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    WorkbenchItemsWorkbenchPlugin:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/WorkbenchItemsWorkbenchPlugin.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/WorkbenchPlugin"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    WorkbenchItemsWorkbenchSnapshot:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/WorkbenchItemsWorkbenchSnapshot.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/WorkbenchSnapshot"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    WorkbenchNote:
      additionalProperties: false
      properties:
        note_path:
          type: string
      required:
        - note_path
      type: object
    WorkbenchPage:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/WorkbenchPage.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/WorkbenchTask"
          type:
            - array
            - "null"
        revision:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
        - items
        - total
        - revision
      type: object
    WorkbenchPauseInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/WorkbenchPauseInputBody.json
          format: uri
          readOnly: true
          type: string
        paused:
          type: boolean
        version:
          format: int64
          minimum: 1
          type: integer
      required:
        - paused
        - version
      type: object
    WorkbenchPlugin:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/WorkbenchPlugin.json
          format: uri
          readOnly: true
          type: string
        connector:
          type: string
        enabled:
          type: boolean
        id:
          type: string
      required:
        - id
        - enabled
        - connector
      type: object
    WorkbenchPluginInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/WorkbenchPluginInputBody.json
          format: uri
          readOnly: true
          type: string
        enabled:
          type: boolean
      required:
        - enabled
      type: object
    WorkbenchResultID:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/WorkbenchResultID.json
          format: uri
          readOnly: true
          type: string
        id:
          type: string
      required:
        - id
      type: object
    WorkbenchSnapshot:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/WorkbenchSnapshot.json
          format: uri
          readOnly: true
          type: string
        attempts:
          items:
            $ref: "#/components/schemas/WorkbenchAttempt"
          type:
            - array
            - "null"
        bridge_configured:
          type: boolean
        capabilities:
          $ref: "#/components/schemas/WorkbenchCapabilities"
        id:
          type: string
        kind:
          type: string
        last_success:
          format: date-time
          type: string
        mode:
          type: string
        name:
          type: string
        paused:
          type: boolean
        pending_writes:
          items:
            $ref: "#/components/schemas/WorkbenchTaskReceipt"
          type:
            - array
            - "null"
        plugin_disabled:
          type: boolean
        read_method:
          type: string
        repository:
          type: string
        scope:
          type: string
        statuses:
          additionalProperties:
            type: string
          type: object
        vault:
          type: string
        version:
          format: int64
          type: integer
        write_enabled:
          type: boolean
      required:
        - capabilities
        - attempts
        - id
        - kind
        - name
        - mode
        - version
      type: object
    WorkbenchSyncResult:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/WorkbenchSyncResult.json
          format: uri
          readOnly: true
          type: string
        attempt_id:
          format: int64
          type: integer
        id:
          type: string
      required:
        - id
        - attempt_id
      type: object
    WorkbenchTask:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/WorkbenchTask.json
          format: uri
          readOnly: true
          type: string
        activity:
          items:
            $ref: "#/components/schemas/WorkbenchTaskEvent"
          type:
            - array
            - "null"
        assignees:
          items:
            type: string
          type:
            - array
            - "null"
        connection_id:
          type: string
        connection_version:
          format: int64
          type: integer
        kind:
          type: string
        label_values:
          additionalProperties:
            type: string
          type: object
        labels:
          items:
            type: string
          type:
            - array
            - "null"
        locator:
          type: string
        mode:
          type: string
        native_fields:
          additionalProperties:
            type: string
          type: object
        native_id:
          type: string
        related:
          items:
            $ref: "#/components/schemas/WorkbenchTaskResource"
          type:
            - array
            - "null"
        source_object_id:
          type: string
        state:
          type: string
        summary:
          type: string
        target_version:
          type: string
        title:
          type: string
      required:
        - source_object_id
        - connection_id
        - native_id
        - kind
        - title
        - locator
        - assignees
        - labels
        - label_values
        - summary
        - related
        - activity
        - native_fields
      type: object
    WorkbenchTaskEvent:
      additionalProperties: false
      properties:
        at:
          type: string
        text:
          type: string
        time:
          format: date-time
          type: string
      required:
        - at
        - time
        - text
      type: object
    WorkbenchTaskReceipt:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/WorkbenchTaskReceipt.json
          format: uri
          readOnly: true
          type: string
        connection_id:
          type: string
        request_id:
          type: string
        source_object_id:
          type: string
        sync_state:
          type: string
      required:
        - request_id
        - connection_id
        - sync_state
      type: object
    WorkbenchTaskResource:
      additionalProperties: false
      properties:
        body:
          type: string
        kind:
          type: string
        task_id:
          type: string
        title:
          type: string
      required:
        - kind
        - title
        - body
        - task_id
      type: object
    WorkbenchTaskWrite:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://apilot/schemas/WorkbenchTaskWrite.json
          format: uri
          readOnly: true
          type: string
        connection_id:
          type: string
        connection_version:
          format: int64
          type: integer
        heading_path:
          items:
            type: string
          type:
            - array
            - "null"
        note_path:
          type: string
        request_id:
          type: string
        source_object_id:
          type: string
        state:
          type: string
        target_version:
          type: string
        title:
          type: string
      required:
        - request_id
        - connection_version
      type: object
info:
  title: Apilot Local Workbench
  version: 1.0.0
openapi: 3.1.0
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkbenchHealth"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Check whether the HTTP service is listening
      tags:
        - System
  /ready:
    get:
      operationId: ready
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkbenchHealth"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Check whether the workbench database is readable
      tags:
        - System
  /v1/workbench/connections:
    get:
      operationId: listWorkbenchConnections
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkbenchItemsWorkbenchSnapshot"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: List connections and latest sync attempts
      tags:
        - Connections
    put:
      operationId: saveWorkbenchConnection
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkbenchConnectionInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkbenchSnapshot"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Save a connection
      tags:
        - Connections
  /v1/workbench/connections/{id}:
    delete:
      operationId: removeWorkbenchConnection
      parameters:
        - in: path
          name: id
          required: true
          schema:
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkbenchResultID"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Remove a connection
      tags:
        - Connections
    get:
      operationId: getWorkbenchConnection
      parameters:
        - in: path
          name: id
          required: true
          schema:
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkbenchSnapshot"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Read a connection
      tags:
        - Connections
  /v1/workbench/connections/{id}/headings:
    get:
      operationId: listWorkbenchHeadings
      parameters:
        - in: path
          name: id
          required: true
          schema:
            minLength: 1
            type: string
        - explode: false
          in: query
          name: note_path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkbenchItemsWorkbenchHeading"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: List heading paths for a note
      tags:
        - Connections
  /v1/workbench/connections/{id}/notes:
    get:
      operationId: listWorkbenchNotes
      parameters:
        - in: path
          name: id
          required: true
          schema:
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkbenchItemsWorkbenchNote"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: List in-scope Markdown notes
      tags:
        - Connections
  /v1/workbench/connections/{id}/paused:
    put:
      operationId: pauseWorkbenchConnection
      parameters:
        - in: path
          name: id
          required: true
          schema:
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkbenchPauseInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkbenchSnapshot"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Set connection pause state
      tags:
        - Connections
  /v1/workbench/connections/{id}/sync:
    get:
      operationId: getWorkbenchSync
      parameters:
        - in: path
          name: id
          required: true
          schema:
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkbenchSnapshot"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Read sync status and recent attempts
      tags:
        - Sync
    post:
      operationId: runWorkbenchSync
      parameters:
        - in: path
          name: id
          required: true
          schema:
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkbenchSyncResult"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
