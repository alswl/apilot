name: Build macOS

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - '.github/workflows/build.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'mygo.json'
      - 'packaging/**'
      - 'resources/**'
      - 'scripts/**'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/build.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'mygo.json'
      - 'packaging/**'
      - 'resources/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CGO_ENABLED: '1'
  GOFLAGS: '-mod=readonly -trimpath'
  ARTIFACT_NAME: apilot-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    name: Test and build · macOS arm64
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go and restore cache
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
          check-latest: false
      - name: Verify platform and release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          test "$(uname -m)" = arm64
          go version
          if [ "$IS_RELEASE" = true ]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('packaging/mygo.json').read_text())['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match packaging/mygo.json version'
          PY
          fi
      - name: Check formatting
        run: |
          files=$(gofmt -l cmd internal)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -vet=off ./...
      - name: Build development App and DMG
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.APPLE_SIGNING_ENABLED == 'true') }}
        run: make app
      - name: Sign and notarize release App and DMG
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.APPLE_SIGNING_ENABLED == 'true'
        timeout-minutes: 15
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: packaging/sign-release.sh
      - name: Package and verify downloads
        run: packaging/package-downloads.sh
      - name: Upload downloads
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Download summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          GO_CACHE_HIT: ${{ steps.go.outputs.cache-hit }}
        run: |
          {
            echo '### macOS arm64 downloads'
            echo "[Download App, CLI and checksums]($ARTIFACT_URL) (GitHub sign-in required; retained 7 days)."
            echo
            echo "Go cache hit: $GO_CACHE_HIT"
            python3 -c 'import json; x=json.load(open("dist/build-info.json")); print("Signing: " + x["signing"] + "; notarized: " + str(x["notarized"]) + ". Apple Silicon only.")'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish tagged downloads
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download this run's verified files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --name "$ARTIFACT_NAME" --dir dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import json
          from pathlib import Path
          info = json.loads(Path('build-info.json').read_text())
          signing = 'Developer ID signed and notarized.' if info['notarized'] and info['signing'] == 'developer-id' else 'Ad-hoc signed; not notarized. macOS may require explicit approval.'
          Path('/tmp/apilot-release-notes.md').write_text('Choose Follow System, English, or Simplified Chinese in Settings → Language. Changes apply immediately and are remembered across launches.\n\nmacOS Apple Silicon. Open the DMG and drag Apilot to Applications.\n\n' + signing + '\n\nVerify downloads with SHA256SUMS. Build provenance is in build-info.json.\n')
          PY
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" apilot-macos-arm64.dmg apilot-macos-arm64.zip apilot-cli-macos-arm64.tar.gz SHA256SUMS build-info.json --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "Apilot $RELEASE_TAG" \
              --notes-file /tmp/apilot-release-notes.md \
              apilot-macos-arm64.dmg apilot-macos-arm64.zip apilot-cli-macos-arm64.tar.gz SHA256SUMS build-info.json
          fi
